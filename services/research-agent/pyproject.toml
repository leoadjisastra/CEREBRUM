[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]

name = "research-agent"
version = "0.1.1"
description = "CEREBRUM Research Agent service"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "python-semantic-release>=10.6.1",
]
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/main.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "research-agent-v{version}"
major_on_zero = false
allow_zero_version = true
build_command = "pip install build && python -m build"
version_toml = [
    "pyproject.toml:project.version"
]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.publish]
upload_to_vcs_release = true